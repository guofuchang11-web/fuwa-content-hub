# 福娃内容中台系统 - Docker Compose 部署配置
# 一键启动前端 + 后端 + 数据库

version: '3.8'

services:
  # 前端服务（Nginx）
  frontend:
    image: nginx:alpine
    container_name: youguo-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../assets:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - youguo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务（FastAPI）
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youguo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/content_hub.db
      - SECRET_KEY=youguo-content-hub-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - STORAGE_MAX_SIZE=8880TB
      - MAX_UPLOAD_SIZE=8880TB
      - SUPPORTED_FORMATS=37+
    volumes:
      - ../backend/data:/app/data
      - ../backend/uploads:/app/uploads
    networks:
      - youguo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  youguo-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
